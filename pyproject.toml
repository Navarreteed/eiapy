[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygasflow"
dynamic = ["version"]
description = "Clean Python access to U.S. EIA natural gas data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pygasflow contributors" }]
keywords = ["eia", "natural-gas", "energy", "pandas", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[tool.hatch.version]
path = "pygasflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pygasflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
