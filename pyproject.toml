[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eiapy"
dynamic = ["version"]
description = "Python client for the U.S. EIA Open Data API v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "eiapy contributors" }]
keywords = ["eia", "energy", "natural-gas", "electricity", "petroleum", "coal", "pandas", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[tool.hatch.version]
path = "eiapy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eiapy"]
artifacts = ["eiapy/_route_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
